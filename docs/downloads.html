<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDFs — JE Civil Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="./index.html"><span class="brand-mark">JE</span> Civil Prep</a>
      <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./practice.html">Practice MCQs</a>
        <a href="./mock.html">Full Mock</a>
        <a href="./notes.html">Notes</a>
        <a href="./downloads.html" class="active">PDFs</a>
      </nav>
    </div>
  </header>

  <main class="wrap section">
    <h1 class="section-title">View & Download PDFs</h1>
    <p class="section-sub">Open in browser or download for offline / print revision</p>

    <div class="pdf-grid" id="pdf-cards"></div>

    <div class="panel" style="margin-top:1.2rem">
      <h2>Preview</h2>
      <p class="muted" id="preview-label">Select <b>View</b> on any PDF above.</p>
      <iframe class="pdf-frame hidden" id="pdf-frame" title="PDF preview"></iframe>
    </div>
  </main>

  <footer class="footer"><div class="wrap">JE Civil Prep · PDFs</div></footer>
  <script src="./assets/js/common.js"></script>
  <script>
    const pdfs = [
      {
        file: "JE_Civil_Complete_Print_Ready.pdf",
        title: "Complete Print Guide",
        desc: "Notes + bilingual MCQs + full mock (answers highlighted).",
      },
      {
        file: "JE_Civil_MCQ_Only_Exam_Practice.pdf",
        title: "MCQ Practice Book",
        desc: "500 topic-wise MCQs with highlighted answers.",
      },
      {
        file: "JE_Civil_Full_Mock_1_Exam.pdf",
        title: "Full Mock #1 PDF",
        desc: "100-question KRCL pattern mock for print practice.",
      },
    ];

    const cards = document.getElementById("pdf-cards");
    const frame = document.getElementById("pdf-frame");
    const label = document.getElementById("preview-label");

    cards.innerHTML = pdfs
      .map((p) => {
        const href = `./pdfs/${p.file}`;
        return `<article class="card pdf-card">
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
          <div class="actions">
            <button class="btn btn-primary" type="button" data-view="${href}" data-title="${p.title}">View</button>
            <a class="btn btn-secondary" href="${href}" download>Download</a>
            <a class="btn btn-ghost" href="${href}" target="_blank" rel="noopener">Open tab</a>
          </div>
        </article>`;
      })
      .join("");

    cards.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-view]");
      if (!btn) return;
      frame.src = btn.dataset.view;
      frame.classList.remove("hidden");
      label.textContent = "Preview: " + btn.dataset.title;
      frame.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</body>
</html>
